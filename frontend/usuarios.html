<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios | Punto de Venta</title>
  <link href="./dist/css/app.css" rel="stylesheet" type="text/css">
  <!-- Anti-FOUC: aplica el tema ANTES del render (evita el flash blanco). -->
  <script src="./services/theme.js"></script>
</head>
<body class="flex">

  <!-- ============================ SIDEBAR ============================ -->
  <aside id="sidebar" class="fixed z-40 inset-y-0 left-0 w-64 bg-pos-bg border-r border-pos-secondary/60 transition-transform duration-300 -translate-x-full lg:translate-x-0 lg:static" aria-label="Navegación principal">
    <div class="flex flex-col h-full">
      <a href="pos.html" class="flex items-center justify-center px-6 h-20 border-b border-pos-secondary/60">
        <img src="./assets/vortex apex logo modo claro dentro del programa.webp" alt="VORTEX APEX" class="block w-full max-w-[14rem] h-auto dark:hidden">
        <img src="./assets/vortex apex logo modo oscuro dentro del programa.webp" alt="VORTEX APEX" class="hidden w-full max-w-[14rem] h-auto dark:block">
      </a>
      <nav id="sidebar-menu" class="flex-1 overflow-y-auto p-4 space-y-1"></nav>
    </div>
  </aside>
  <div id="sidebar-overlay" class="fixed inset-0 z-30 bg-pos-overlay/50 backdrop-blur-sm lg:hidden hidden"></div>

  <!-- ===================== CONTENIDO PRINCIPAL ===================== -->
  <div class="flex flex-col flex-1 min-w-0">

    <!-- Header -->
    <header class="sticky top-0 z-20 flex items-center gap-4 px-4 sm:px-6 h-16 bg-pos-bg border-b border-pos-secondary/60">
      <button id="menu-toggle" class="p-2 -ml-2 rounded-lg text-pos-text-head hover:bg-pos-secondary/40 lg:hidden" type="button" aria-label="Abrir menú">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h4 class="text-lg font-semibold text-pos-text-head">Usuarios</h4>
      <button class="ml-auto flex items-center gap-2 p-1.5 rounded-lg hover:bg-pos-secondary/40" type="button">
        <span class="flex items-center justify-center h-8 w-8 rounded-full bg-pos-primary text-pos-primary-text text-sm font-semibold" id="profile-initial">U</span>
        <span class="hidden sm:block text-sm font-medium text-pos-text-body" id="profile-name">Usuario</span>
        <span id="profile-rol"></span>
      </button>
    </header>

    <!-- Contenido -->
    <main class="p-4 sm:p-6 space-y-6">

      <!-- Encabezado con acciones -->
      <div class="flex items-center justify-between gap-4 flex-wrap">
        <div>
          <h4 class="text-xl font-bold text-pos-text-head">Gestión de usuarios</h4>
          <p class="text-sm text-pos-text-body/70">Creá cajeros o administradores y administrá sus accesos.</p>
        </div>
        <button id="btn-nuevo" class="btn-primary">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          <span>Nuevo usuario</span>
        </button>
      </div>

      <!-- Tabla de usuarios -->
      <div class="pos-card overflow-hidden">
        <div class="pos-table-wrap">
          <table class="pos-table">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Rubro</th>
                <th>Estado</th>
                <th class="text-right">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-usuarios">
              <tr><td colspan="6" class="text-center text-pos-text-body/60 py-8">Cargando usuarios...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- ===================== MODAL: NUEVO USUARIO ===================== -->
  <div id="modal-usuario" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-pos-overlay/50 backdrop-blur-sm"></div>
    <div class="relative w-full max-w-md bg-pos-bg rounded-xl shadow-lg p-6 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-5">
        <h4 class="text-lg font-semibold text-pos-text-head">Nuevo usuario</h4>
        <button type="button" class="text-pos-text-body/60 hover:text-pos-text-head" data-close>
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="form-usuario" class="space-y-4">
        <div id="u-error" class="hidden text-sm text-pos-danger bg-pos-danger/10 border border-pos-danger/30 rounded-lg px-3 py-2"></div>
        <div>
          <label class="form-label" for="u-nombre">Nombre completo</label>
          <input id="u-nombre" type="text" class="form-input-pos" required>
        </div>
        <div>
          <label class="form-label" for="u-email">Correo electrónico</label>
          <input id="u-email" type="email" class="form-input-pos" placeholder="usuario@negocio.com" required>
        </div>
        <div>
          <label class="form-label" for="u-password">Contraseña</label>
          <input id="u-password" type="password" class="form-input-pos" placeholder="Mínimo 6 caracteres" required>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="form-label" for="u-rol">Rol</label>
            <select id="u-rol" class="form-input-pos">
              <option value="cajero">Cajero</option>
              <option value="admin">Administrador</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="u-rubro">Rubro del negocio</label>
            <select id="u-rubro" class="form-input-pos">
              <option value="general">General</option>
              <option value="panaderia_alimentos">Panadería / Alimentos</option>
              <option value="indumentaria">Indumentaria</option>
              <option value="ferreteria">Ferretería</option>
              <option value="libreria">Librería</option>
            </select>
          </div>
        </div>
        <p class="text-xs text-pos-text-body/60">
          El rubro define qué campos extra de inventario ve el usuario (talle/color para indumentaria, vencimientos para alimentos).
        </p>
        <div class="flex justify-end gap-3 mt-6">
          <button type="button" class="btn-secondary" data-close>Cancelar</button>
          <button type="submit" class="btn-primary">Crear usuario</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JS del layout (menú responsive + cierre de modales) -->
  <script>
    (function () {
      const menu = document.getElementById('menu-toggle');
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      function closeS() { sidebar?.classList.add('-translate-x-full'); overlay?.classList.add('hidden'); }
      function openS() { sidebar?.classList.remove('-translate-x-full'); overlay?.classList.remove('hidden'); }
      menu?.addEventListener('click', () => sidebar?.classList.contains('-translate-x-full') ? openS() : closeS());
      overlay?.addEventListener('click', closeS);
      // Cierre genérico de modales
      document.addEventListener('click', (e) => {
        if (e.target.closest('[data-close]')) {
          const m = e.target.closest('[id^="modal"]');
          if (m) { m.classList.add('hidden'); m.classList.remove('flex'); }
        }
      });
    })();
  </script>

  <!-- Seguridad: backend local JWT (sin Supabase) -->
  <script src="./services/config.js"></script>
  <script src="./services/guard.js"></script>

  <!-- JS de Usuarios -->
  <script type="module" src="./services/usuarios.js"></script>
</body>
</html>
