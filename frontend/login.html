<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Punto de Venta</title>
  <!-- CSS compilado de Tailwind con la paleta pos-* -->
  <link href="./dist/css/app.css" rel="stylesheet" type="text/css">
  <!-- Anti-FOUC: aplica el tema ANTES del render (evita el flash blanco). -->
  <script src="./services/theme.js"></script>
</head>
<body class="bg-pos-primary h-screen w-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Tarjeta de inicio de sesión: fondo pos-bg + sombra pos-card -->
    <div class="bg-pos-bg shadow-pos-card rounded-2xl border border-pos-secondary/40">
      <div class="px-6 py-8">

        <!-- Marca: logo dinámico (claro/oscuro) por variante de tema.
             mt-10 lo desplaza hacia abajo; tamaño ampliado (h-28/h-32). -->
        <div class="flex flex-col items-center text-center mt-10 mb-10">
          <a href="login.html" aria-label="Vortex Apex — Punto de Venta" class="flex flex-col items-center">
            <img src="./assets/vortex apex logo modo claro login.webp" alt="VORTEX APEX" class="h-28 sm:h-32 w-auto block dark:hidden">
            <img src="./assets/vortex apex logo modo oscuro login.webp" alt="VORTEX APEX" class="h-28 sm:h-32 w-auto hidden dark:block">
          </a>
        </div>

        <h2 class="text-2xl font-bold text-pos-text-head text-center mb-1">Bienvenido de nuevo</h2>
        <p class="text-center text-sm text-pos-text-body/70 mb-8">Inicia sesión para continuar al Punto de Venta</p>

        <!-- Formulario tradicional: Email + Contraseña + botón -->
        <form id="login-form" class="space-y-4" novalidate>
          <div>
            <label class="form-label" for="login-email">Correo electrónico</label>
            <input id="login-email" type="email" class="form-input-pos" placeholder="usuario@correo.com" autocomplete="email" required>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="form-label mb-0" for="login-password">Contraseña</label>
              <a href="#" class="text-sm text-pos-primary hover:underline">¿Olvidaste tu contraseña?</a>
            </div>
            <input id="login-password" type="password" class="form-input-pos" placeholder="••••••••" autocomplete="current-password" required>
          </div>

          <p id="login-error" class="hidden text-sm text-pos-danger font-medium"></p>

          <!-- Botón principal -->
          <button type="submit" class="btn-primary w-full !py-3">Iniciar Sesión</button>
        </form>

      </div>
    </div>

    <!-- Link inferior -->
    <p class="text-pos-primary-text text-center mt-6 text-sm">
      ¿No tienes cuenta? <a href="register.html" class="font-semibold hover:underline">Regístrate</a>
    </p>
  </div>

  <!-- Configuración de la API local -->
  <script src="./services/config.js"></script>
  <!-- Lógica de autenticación (FastAPI local/JWT) -->
  <script src="./services/auth.js"></script>
</body>
</html>
