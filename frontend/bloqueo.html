<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Licencia Expirada | Punto de Venta</title>
  <link href="./dist/css/app.css" rel="stylesheet" type="text/css">
  <script src="./services/theme.js"></script>
</head>
<body class="bg-pos-primary h-screen w-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="bg-pos-bg shadow-pos-card rounded-2xl border border-pos-secondary/40">
      <div class="px-6 py-8">

        <div class="flex flex-col items-center text-center mt-6 mb-6">
          <svg class="h-16 w-16 text-pos-danger mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
          <h2 class="text-2xl font-bold text-pos-text-head text-center mb-1">Licencia Vencida</h2>
          <p id="bloqueo-mensaje" class="text-center text-sm text-pos-text-body/70 mb-4">El acceso al sistema ha sido suspendido.</p>
          <p id="bloqueo-contacto" class="text-center text-sm text-pos-text-body font-semibold mb-6"></p>
        </div>

                <!-- Panel de activación por CÓDIGO FIRMADO, visible solo para ADMIN.
             Nuevo flujo (Etapa 2): NO se ingresa clave ni fecha. El cliente
             COPIA su huella y se la envía al proveedor; este devuelve un código
             firmado que se pega aquí. El backend lo verifica con la llave
             pública Ed25519 (el usuario no elige fechas). -->
        <div id="activacion-panel" class="hidden">
          <div class="border-t border-pos-secondary/40 pt-4">
            <h3 class="text-sm font-semibold text-pos-text-head mb-3 text-center">Activación de Licencia (Admin)</h3>

            <!-- Paso 1: huella de la máquina -->
            <label class="form-label">Paso 1 — Enviá este código a tu proveedor</label>
            <div class="flex gap-2 mb-4">
              <input id="licencia-huella" type="text" class="form-input-pos font-mono text-xs" readonly>
              <button type="button" id="btn-copiar-huella" class="btn-secondary whitespace-nowrap px-3">Copiar</button>
            </div>

            <!-- Paso 2: pegar el código firmado recibido -->
            <form id="activacion-form" class="space-y-2" novalidate>
              <label class="form-label" for="licencia-codigo">Paso 2 — Pegá el código de activación recibido</label>
              <textarea id="licencia-codigo" class="form-input-pos font-mono text-xs" rows="3"
                        placeholder="VX1...." required></textarea>

              <p id="activacion-error" class="hidden text-sm text-pos-danger font-medium text-center"></p>
              <p id="activacion-success" class="hidden text-sm text-green-600 font-medium text-center"></p>

              <button type="submit" id="btn-activar" class="btn-primary w-full !py-3 mt-2">Activar Licencia</button>
            </form>

            <!-- WhatsApp opcional: abre el mensaje con la huella ya escrita.
                 NO requiere internet en el POS: solo abre la app/Web de WhatsApp. -->
            <button type="button" id="btn-whatsapp" class="btn-secondary w-full !py-2 mt-3 hidden">
              Enviar huella por WhatsApp
            </button>
          </div>
        </div>
        
                <div class="mt-6 flex justify-center">
            <button id="btn-logout" type="button" class="text-pos-danger hover:underline text-sm font-medium">Cerrar Sesión</button>
        </div>

        <!-- Descarga de respaldo completo: sección independiente del panel admin
             porque es un DERECHO del comercio (sus datos), no una acción de
             activación. El backend solo la autoriza para rol admin. -->
        <div class="mt-4 pt-4 border-t border-pos-secondary/40">
            <button type="button" id="btn-descargar-datos"
                    class="btn-secondary w-full !py-2.5">
              Descargar todos mis datos (Excel)
            </button>
            <p id="descarga-msg" class="hidden text-center text-xs mt-2"></p>
        </div>

      </div>
    </div>
  </div>

  <script src="./services/config.js"></script>
  <script type="module" src="./services/bloqueo.js"></script>
</body>
</html>
