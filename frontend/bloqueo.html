<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Licencia Expirada | Punto de Venta</title>
  <link rel="icon" type="image/png" href="./assets/favicon.png">
  <link href="./dist/css/app.css" rel="stylesheet" type="text/css">
  <script src="./services/theme.js"></script>
</head>
<body class="bg-pos-bg">
  <div class="auth-shell">

    <!-- Panel de marca (solo escritorio): carbón del logo, sin datos ni claims inventados. -->
    <section class="auth-brand rail hidden lg:flex" aria-label="Vortex Apex">
      <svg class="auth-deco" viewBox="0 0 400 400" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M200 20 360 290H40L200 20z"/><path d="M200 80 316 270H84L200 80z"/><path d="M200 140 272 250H128L200 140z"/></svg>
      <img src="./assets/vx-wordmark-sobre-oscuro.webp" alt="VORTEX APEX" width="1000" height="82" class="relative block w-56 h-auto">
      <div class="relative">
        <img src="./assets/vx-marca-sobre-oscuro.webp" alt="" width="400" height="360" class="block h-24 w-auto mb-8">
        <p class="font-marca text-3xl font-semibold leading-tight text-white max-w-[20ch]">Tu licencia necesita renovarse.</p>
        <ul class="mt-8 space-y-3 text-sm">
          <li class="auth-punto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Funciona sin conexión a internet</li>
          <li class="auth-punto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Tus datos quedan en esta computadora</li>
          <li class="auth-punto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Caja, stock y cuentas corrientes en un solo lugar</li>
        </ul>
      </div>
      <span class="relative text-xs opacity-75">Punto de Venta</span>
    </section>

    <main class="auth-panel">
      <div class="auth-card">
        <a href="login.html" aria-label="Vortex Apex, Punto de Venta" class="lg:hidden mb-8 block">
          <img src="./assets/vx-wordmark-sobre-claro.webp" alt="VORTEX APEX" width="1000" height="78" class="h-6 w-auto block dark:hidden">
          <img src="./assets/vx-wordmark-sobre-oscuro.webp" alt="VORTEX APEX" width="1000" height="82" class="h-6 w-auto hidden dark:block">
        </a>
        <div class="flex flex-col items-start text-left mb-6">
          <span class="mb-5 inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-pos-danger/10 text-pos-danger"><svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
          <h1 class="font-marca text-2xl font-semibold text-pos-text-head mb-2">Licencia vencida</h1>
          <p id="bloqueo-mensaje" class="text-sm text-pos-text-body/80 mb-4">El acceso al sistema ha sido suspendido.</p>
          <p id="bloqueo-contacto" class="text-sm text-pos-text-head font-semibold mb-2"></p>
        </div>

                <!-- Panel de activación por CÓDIGO FIRMADO, visible solo para ADMIN.
             Nuevo flujo (Etapa 2): NO se ingresa clave ni fecha. El cliente
             COPIA su huella y se la envía al proveedor; este devuelve un código
             firmado que se pega aquí. El backend lo verifica con la llave
             pública Ed25519 (el usuario no elige fechas). -->
        <div id="activacion-panel" class="hidden">
          <div class="border-t border-pos-secondary/70 pt-4">
            <h2 class="text-sm font-semibold text-pos-text-head mb-3">Activación de Licencia (Admin)</h2>

            <!-- Paso 1: huella de la máquina -->
            <label class="form-label">Paso 1 — Enviá este código a tu proveedor</label>
            <div class="flex gap-2 mb-4">
              <input id="licencia-huella" type="text" class="form-input-pos font-mono text-xs" readonly>
              <button type="button" id="btn-copiar-huella" class="btn-secondary whitespace-nowrap px-3">Copiar</button>
            </div>

            <!-- Paso 2: pegar el código firmado recibido -->
            <form id="activacion-form" class="space-y-2" novalidate>
              <label class="form-label" for="licencia-codigo">Paso 2 — Pegá el código de activación recibido</label>
              <textarea id="licencia-codigo" class="form-input-pos font-mono text-xs" rows="3"
                        placeholder="VX1...." required></textarea>

              <p id="activacion-error" class="hidden text-sm text-pos-danger font-medium"></p>
              <p id="activacion-success" class="hidden text-sm text-pos-success font-medium"></p>

              <button type="submit" id="btn-activar" class="btn-primary w-full !py-3 mt-2">Activar Licencia</button>
            </form>

            <!-- WhatsApp opcional: abre el mensaje con la huella ya escrita.
                 NO requiere internet en el POS: solo abre la app/Web de WhatsApp. -->
            <button type="button" id="btn-whatsapp" class="btn-secondary w-full !py-2 mt-3 hidden">
              Enviar huella por WhatsApp
            </button>
          </div>
        </div>
        
                <div class="mt-6 flex justify-center">
            <button id="btn-logout" type="button" class="text-pos-danger hover:underline text-sm font-medium">Cerrar Sesión</button>
        </div>

        <!-- Descarga de respaldo completo: sección independiente del panel admin
             porque es un DERECHO del comercio (sus datos), no una acción de
             activación. El backend solo la autoriza para rol admin. -->
        <div class="mt-4 pt-4 border-t border-pos-secondary/70">
            <button type="button" id="btn-descargar-datos"
                    class="btn-secondary w-full !py-2.5">
              Descargar todos mis datos (Excel)
            </button>
            <p id="descarga-msg" class="hidden text-center text-xs mt-2"></p>
        </div>

      </div>
    </main>
  </div>

  <script src="./services/config.js"></script>
  <script type="module" src="./services/bloqueo.js"></script>
</body>
</html>
