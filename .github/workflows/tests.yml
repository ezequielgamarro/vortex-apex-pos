name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    # El POS se usa en Windows (huella de máquina, instalador NSIS): se prueba ahí.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: python -m pip install -r app/requirements-dev.txt
      - name: Pruebas (backend + reglas del frontend)
        run: python -m pytest tests -q -p no:cacheprovider

  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sintaxis del proceso principal y del preload
        run: |
          node --check electron/main.js
          node --check electron/preload.js
